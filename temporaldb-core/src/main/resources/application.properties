# TemporalDB Core Configuration

# Server
server.port=9090
server.host=0.0.0.0

# Memory
memory.max-bytes=10737418240
memory.pool-size=1073741824
memory.max-buffers-per-size=100

# Database
db.name=temporaldb
db.data-dir=/data/temporaldb

# Logging
logging.level.root=INFO
logging.level.com.temporaldb=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# gRPC
grpc.port=9090
grpc.max-concurrent-streams=100
grpc.keepalive-time=30
grpc.keepalive-timeout=5